version: '3.9'
services:
  # Evolution API Service
  evolution-api:
    container_name: evolution_api
    # Usando a versão 2.3.7 da imagem do Evolution API
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    # Montagem de volume para persistência dos dados da aplicação
    volumes:
      - evolution_instances:/evolution/instances
    # Dependências de serviços
    depends_on:
      - postgres
      - redis

  # PostgreSQL Service
  postgres:
    container_name: postgres
    image: postgres:17
    # Ajuste do max_connections para suportar mais conexões simultâneas
    command: ["postgres", "-c", "max_connections=1000"]
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432

  # Redis Service
  redis:
    image: redis:latest
    container_name: redis
    # Comando do redis para habilitar a persistência de dados
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - redis:/data
    ports:
      - 6379:6379

# Definindo volumes para persistência de dados
volumes:
  evolution_instances:
  postgres_data:
  redis: